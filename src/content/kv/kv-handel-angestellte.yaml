classificationNotes: >-
  Der Handels-KV unterscheidet acht Beschäftigungsgruppen (A bis H). Die
  Einstufung richtet sich nach der tatsächlich ausgeübten Tätigkeit, nicht nach
  dem Jobtitel. Innerhalb einer Gruppe steigt das Mindestgehalt mit den
  Berufsjahren. Maßgeblich ist die offizielle Gehaltstafel.
