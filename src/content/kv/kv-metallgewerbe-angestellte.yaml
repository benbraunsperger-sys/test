classificationNotes: >-
  Die Einstufung richtet sich nach der tatsächlich ausgeübten Tätigkeit, nicht
  nach der Berufsbezeichnung. Innerhalb einer Verwendungsgruppe steigt das
  Mindestgehalt mit den Verwendungsgruppenjahren (Vorrückung). Maßgeblich sind
  die Tätigkeitsmerkmale des offiziellen Kollektivvertrags.
